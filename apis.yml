- type: UseCases
  data:
  - name: NFT Portfolio Tracker
    description: Retrieve tokens owned by a wallet and activity history to build a multi-chain NFT portfolio
      dashboard
  - name: Collection Analytics
    description: Pull collection statistics, holder distributions, and leaderboard data for market intelligence
      tools
  - name: Programmatic Trading Bot
    description: Use trading instruction endpoints to automate buy, sell, and bid operations on the Solana
      marketplace
  - name: AMM Market Making
    description: Create and manage MMM liquidity pools on Solana NFT collections for algorithmic market-making
      strategies
  - name: Ordinals/Runes Explorer
    description: Surface Bitcoin inscription and Runes marketplace data, listings, and wallet balances
      in explorer UIs
  - name: Marketplace Aggregator
    description: Aggregate Magic Eden listings alongside other venues using the batch listings and search
      endpoints
  url: ''
- type: Features
  data:
  - name: Multi-Chain Coverage
    description: Single API surface spanning Solana, Bitcoin (Ordinals and Runes), Ethereum, and Polygon
      NFT markets
  - name: Data and Trading in One
    description: Both read-only market data endpoints and write-side transaction instruction generation
      in one API
  - name: AMM Pool Management
    description: Full lifecycle management of automated market maker liquidity pools on Solana NFT collections
  - name: Wallet-Level Activity
    description: Comprehensive wallet endpoints covering holdings, offers, escrow, and activity feeds
  - name: Runes Protocol Support
    description: Native support for the Bitcoin Runes protocol including order creation, swaps, quotes,
      and sweeping
  - name: API Key Application
    description: Free public tier available without API key; higher QPS tiers accessible via application
      form
  url: ''
features:
- name: Multi-chain marketplace coverage
  description: Single developer platform spanning Solana, ten EVM chains, and Bitcoin Ordinals / Runes
    from one set of API conventions.
- name: Signed-transaction instruction APIs
  description: Server-side generation of unsigned Solana transactions, EVM EIP-712 signing payloads, and
    Bitcoin PSBTs that clients co-sign and broadcast.
- name: MMM AMM pool primitives
  description: Programmatic creation, deposit, fulfillment, update, and close of Magic Eden Market Maker
    (MMM) AMM pools on Solana.
- name: Reservoir-powered EVM indexing
  description: EVM API surface built on Reservoir Protocol, exposing orderbook and asset data across all
    supported L1/L2 chains.
