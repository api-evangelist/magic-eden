openapi: 3.0.1
info:
  title: Magic Eden EVM Activity instructions API
  description: Aggregated Magic Eden EVM API (v4) for Ethereum and L2 chains (Polygon, Base, ApeChain, Arbitrum, Berachain, BSC, SEI, Abstract). Covers collections, assets, bids, asks, listings, buy/sell, and bulk transfer instructions.
  version: v4
  termsOfService: https://magiceden.io/terms-of-service.pdf
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
servers:
- url: https://api-mainnet.magiceden.dev/v4/evm-public
tags:
- name: instructions
  description: Get instructions for the blockchain
paths:
  /instructions/buy:
    get:
      deprecated: false
      summary: Get instruction to buy (bid)
      security:
      - bearerAuth: []
      responses:
        '200':
          description: successful operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Transaction'
      parameters:
      - name: buyer
        in: query
        description: Buyer wallet
        required: true
        deprecated: false
        schema:
          type: string
      - name: auctionHouseAddress
        in: query
        description: Auction house Address. If not provided, will use default auction house.
        required: false
        deprecated: false
        schema:
          type: string
      - name: tokenMint
        in: query
        description: Token mint address
        required: true
        deprecated: false
        schema:
          type: string
      - name: price
        in: query
        description: Price in SOL
        required: true
        deprecated: false
        schema:
          type: number
      - name: buyerReferral
        in: query
        description: Buyer referral wallet
        required: false
        deprecated: false
        schema:
          type: string
      - name: expiry
        in: query
        description: timestamp in seconds in the future, 0 will default to 7 days.
        required: false
        deprecated: false
        schema:
          type: number
      - name: priorityFee
        in: query
        description: Priority fee (in microlamports) to reprioritize the transaction against others
        required: false
        deprecated: false
        schema:
          type: number
      tags:
      - instructions
