                sellerReferral: ''
                price: 5.05
        '400':
          description: Invalid symbol
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: symbol
        in: path
        description: collection symbol
        required: true
        deprecated: false
        schema:
          type: string
        example: btest
      - name: offset
        in: query
        description: The number of items to skip, default 0, min 0
        required: false
        deprecated: false
        schema:
          type: integer
      - name: limit
        in: query
        description: The numbers of items to return, default 100, min 1, max 1000
        required: false
        deprecated: false
        schema:
          type: integer
      tags:
      - Collections
    servers:
    - url: https://api-mainnet.magiceden.dev/v2
    - url: https://api-devnet.magiceden.dev/v2
