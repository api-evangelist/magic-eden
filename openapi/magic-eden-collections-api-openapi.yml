openapi: 3.2.0
info:
  title: Magic Eden Collections API
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  termsOfService: https://magiceden.io/terms-of-service.pdf
  version: '1.0'
  description: 'Operations tagged Collections across 3 of this provider''s published API definitions: magic-eden-evm-openapi.yml, magic-eden-ordinals-openapi.yml, magic-eden-solana-openapi.yml. Each path carries the servers of the definition it was published in.'
servers:
- url: https://api-mainnet.magiceden.dev/v4/evm-public
- url: https://api-mainnet.magiceden.dev/v2
- url: https://api-devnet.magiceden.dev/v2
tags:
- name: Collections
paths:
  /collections:
    post:
      summary: Collections
      operationId: getCollections
      description: Use this API to explore a collection's metadata and statistics (sales, volume, etc).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/getCollectionsRequest'
      tags:
      - Collections
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getCollectionsResponse'
      x-order: 1
    get:
      deprecated: false
      summary: Get collections
      security: []
      responses:
        '200':
          description: success response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ICollectionV2'
              example:
              - symbol: trippinshrooms
                name: Trippin Shrooms
                description: 'A collection of 555 NFTs spreading some love across the Solana blockchain.


                  No roadmap, no promises just awesome vibes!'
                image: https://arweave.net/PO6QTMV1xuQjWPCgZFe7wSuVtmtNGiK3zRM4jsEL4ao
                twitter: https://www.twitter.com/Trippin_Shrooms
                discord: https://www.discord.gg/zPqyBpRNXd
                categories:
                - pfps
                - art
              - symbol: shadow_lords
                name: Shadow Lords
                description: When darkness falls, Shadow Lords reign supreme.
                image: https://creator-hub-prod.s3.us-east-2.amazonaws.com/shadow_lords_pfp_1656315133604.gif
                twitter: https://www.twitter.com/ShadowLordsNFT
                discord: https://www.discord.gg/9JNJWYBGBu
                website: ''
                categories:
                - pfps
                - art
          headers:
            ME-Pub-API-Metadata:
              description: Will return paging metadata if requested
              schema:
                $ref: '#/components/schemas/ResponseMetadata'
      parameters:
      - name: ME-Pub-API-Metadata
        in: header
        description: This endpoint supports paging metadata
        required: false
        deprecated: false
        schema:
          $ref: '#/components/schemas/RequestMetadata'
      - name: offset
        in: query
        description: The number of items to skip, default 0, min 0
        required: false
        deprecated: false
        schema:
          type: integer
      - name: limit
        in: query
        description: The numbers of items to return, default 200, min 1, max 500
        required: false
        deprecated: false
        schema:
          type: integer
      tags:
      - Collections
    servers:
    - url: https://api-mainnet.magiceden.dev/v4/evm-public
  /collections/user-collections:
    post:
      summary: User Collections
      operationId: getUserCollections
      description: Use this API to explore a user's collections metadata and statistics (sales, volume, etc).
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/getUserCollectionsRequest'
      tags:
      - Collections
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/getUserCollectionsResponse'
      x-order: 2
    servers:
    - url: https://api-mainnet.magiceden.dev/v4/evm-public
  /collections/search:
    post:
      summary: Search Collections
      operationId: searchCollections
      description: Use this API to do a fuzzy collection search
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/searchCollectionsRequest'
      tags:
      - Collections
      responses:
        '200':
          description: Successful
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/searchCollectionsResponse'
    servers:
    - url: https://api-mainnet.magiceden.dev/v4/evm-public
  /v2/ord/btc/stat:
    get:
      tags:
      - Collections
      summary: Get collection stats
      description: Get collection stats
      parameters:
      - name: collectionSymbol
        in: query
        description: Collection symbol
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionStatSchema'
    servers:
    - url: https://api-mainnet.magiceden.dev/v2
  /v2/ord/btc/collections/{symbol}:
    get:
      tags:
      - Collections
      summary: Get collection
      description: Get collection
      operationId: getCollection
      parameters:
      - name: symbol
        in: path
        description: Collection symbol
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionSchema'
    servers:
    - url: https://api-mainnet.magiceden.dev/v2
  /collection_stats/search/bitcoin:
    servers:
    - url: https://stats-mainnet.magiceden.dev
    get:
      tags:
      - Collections
      summary: Get collection statistics
      description: Get collection statistics
      operationId: getCollectionStats
      parameters:
      - name: window
        in: query
        description: Time window
        required: false
        schema:
          type: string
          enum:
          - 10m
          - 1h
          - 6h
          - 1d
          - 7d
          - 30d
          default: 1d
      - name: sort
        in: query
        description: Sort by
        required: false
        schema:
          type: string
          enum:
          - volume
          - volumePercentageChange
          - totalVolume
          - sales
          - salesPercentageChange
          - totalSales
          - floorPrice
          - floorPricePercentageChange
          - topOffer
          - listedOverSupply
          - ownerPercentage
          - pending
          - marketCap
          default: volume
      - name: direction
        in: query
        description: Sort direction
        required: false
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      - name: offset
        in: query
        description: Offset
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 0
      - name: limit
        in: query
        description: Limit
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 1000
          default: 100
      responses:
        '200':
          description: Successful response
  /collections/{collectionSymbol}/attributes:
    get:
      deprecated: false
      summary: Get attributes of a collection
      security: []
      responses:
        '200':
          description: success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionAttributes'
        '400':
          description: Invalid symbol
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: collectionSymbol
        in: path
        description: collection symbol
        required: true
        deprecated: false
        schema:
          type: string
      tags:
      - Collections
    servers:
    - url: https://api-mainnet.magiceden.dev/v2
    - url: https://api-devnet.magiceden.dev/v2
  /collections/{symbol}/activities:
    get:
      deprecated: false
      summary: Get activities of a collection
      security: []
      responses:
        '200':
