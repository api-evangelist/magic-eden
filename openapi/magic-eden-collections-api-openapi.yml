components:
  schemas:
    collectionRoyalty:
      type: object
      properties:
        recipient:
          type: string
        bps:
          type: number
          maximum: 10000
          minimum: 0
        isOptional:
          type: boolean
      required:
      - recipient
      - bps
      - isOptional
    collectionTransferabilityEnum:
      type: string
      enum:
      - TRANSFERABLE_TRADABLE
      - TRANSFERABLE_NOT_TRADABLE
      - NOT_TRANSFERABLE_NOT_TRADABLE
      - NOT_TRANSFERABLE_TRADABLE
    chainEnum:
      type: string
      enum:
      - ethereum
      - abstract
      - apechain
      - arbitrum
      - base
      - berachain
      - bsc
      - polygon
      - sei
      - avalanche
      - monad
    searchCollectionsRequest:
      type: object
      properties:
        chain:
          $ref: '#/components/schemas/chainEnum'
        pattern:
          type: string
          description: Any name pattern you want to search for collections. Only first 50 collection matched will be returned
      required:
      - chain
      - pattern
    getCollectionsById:
      type: object
      properties:
        collectionIds:
          description: 'List of collection IDs to retrieve. example: `0xbd3531da5cf5857e7cfaa92426877b022e612cf8` '
          type: array
          items:
            type: string
          maxItems: 100
      required:
      - collectionIds
    getUserCollectionsResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/userCollectionSchema'
      required:
      - collections
    media:
      type: object
      properties:
        url:
          type: string
        mimeType:
          type: string
    chainAsset:
      type: object
      properties:
        chain:
          $ref: '#/components/schemas/chainEnum'
        assetId:
          type: string
      required:
      - chain
      - assetId
    getCollectionsBySlugs:
      type: object
      properties:
        collectionSlugs:
          description: 'List of collection Slugs to retrieve. example: `pudgypenguins` '
          type: array
          items:
            type: string
          maxItems: 100
      required:
      - collectionSlugs
    getCollectionsRequest:
      type: object
      properties:
        chain:
          $ref: '#/components/schemas/chainEnum'
        includeMintConfig:
          type: boolean
          description: Whether to include mint configuration.
        includeOwnerAddress:
          type: boolean
          description: Whether to include owner address.
      oneOf:
      - $ref: '#/components/schemas/getCollectionsById'
      - $ref: '#/components/schemas/getCollectionsBySlugs'
      required:
      - chain
    collectionTypeEnum:
      type: string
      enum:
      - ERC721
      - ERC1155
    searchCollectionsResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/collectionSchema'
      required:
      - collections
    getCollectionsResponse:
      type: object
      properties:
        collections:
          type: array
          items:
            $ref: '#/components/schemas/collectionSchema'
      required:
      - collections
    getUserCollectionsRequest:
      type: object
      properties:
        chain:
          $ref: '#/components/schemas/chainEnum'
        walletAddresses:
          description: 'a list of user wallet address to query collection stats from. example: `0x47d88afbba889709abba07339ed1c88079944ca3` '
          type: array
          maxItems: 100
          items:
            type: string
      required:
      - walletAddresses
    collectionVerificationEnum:
      type: string
      enum:
      - VERIFIED
      - UNVERIFIED
    collectionMintStageKindEnum:
      type: string
      enum:
      - public
      - allowlist
    collectionMintStage:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/collectionMintStageKindEnum'
        price:
          type: object
          properties:
            currency:
              $ref: '#/components/schemas/chainAsset'
            raw:
              type: string
          required:
          - currency
          - raw
        startTime:
          type: string
        endTime:
          type: string
        walletLimit:
          type: number
          minimum: 0
          maximum: 1000
        maxSupply:
          type: number
          minimum: 1
      required:
      - kind
      - price
    social:
      type: object
      properties:
        twitterUsername:
          type: string
        discordUrl:
          type: string
        websiteUrl:
          type: string
    userCollectionSchema:
      allOf:
      - $ref: '#/components/schemas/collectionSchema'
      - type: object
        properties:
          ownedCount:
            type: number
            minimum: 0
          listedCount:
            type: number
            minimum: 0
        required:
        - ownedCount
        - listedCount
    listingCurrency:
      type: object
      properties:
        address:
          type: string
        name:
          type: string
        symbol:
          type: string
        decimals:
          type: number
      required:
      - address
      - name
      - symbol
      - decimals
    collectionSchema:
      type: object
      properties:
        chain:
          $ref: '#/components/schemas/chainEnum'
        id:
          type: string
        name:
          type: string
        symbol:
          type: string
          description: i.e. collection slug
        description:
          type: string
        media:
          $ref: '#/components/schemas/media'
        social:
          $ref: '#/components/schemas/social'
        verification:
          $ref: '#/components/schemas/collectionVerificationEnum'
        isTradeable:
          type: boolean
        royalty:
          $ref: '#/components/schemas/collectionRoyalty'
        collectionType:
          $ref: '#/components/schemas/collectionTypeEnum'
        isSeaportV16Disabled:
          type: boolean
        isSeaportV16RoyaltyOptional:
          type: boolean
        seaportV16ListingCurrencies:
          type: array
          items:
            $ref: '#/components/schemas/listingCurrency'
        chainData:
          type: object
          properties:
            contract:
              type: string
            transferability:
              $ref: '#/components/schemas/collectionTransferabilityEnum'
            collectionBidSupported:
              type: boolean
            contractDeployedAt:
              type: string
            isMinting:
              type: boolean
            owner:
              type: string
            mintConfig:
              type: object
              properties:
                maxSupply:
                  type: string
                totalSupply:
                  type: string
                walletLimit:
                  type: string
                baseURI:
                  type: string
                contractURI:
                  type: string
                stages:
                  type: array
                  items:
                    $ref: '#/components/schemas/collectionMintStage'
                payoutRecipient:
                  type: string
                royaltyRecipient:
                  type: string
                royaltyBps:
                  type: string
                mintFee:
                  type: string
              required:
              - maxSupply
              - totalSupply
              - walletLimit
              - baseURI
              - contractURI
              - stages
              - payoutRecipient
              - royaltyRecipient
              - royaltyBps
          required:
          - contract
          - transferability
          - collectionBidSupported
          - isMinting
      required:
      - chain
      - id
      - name
      - verification
      - isTradeable
      - collectionType
    CollectionSchema:
      type: object
      properties:
        symbol:
          type: string
        name:
          type: string
        imageURI:
          type: string
        chain:
          type: string
        description:
          type: string
        supply:
          type: integer
        twitterLink:
          type: string
        discordLink:
          type: string
        websiteLink:
          type: string
        min_inscription_number:
          type: integer
        max_inscription_number:
          type: integer
        createdAt:
          type: string
    CollectionStatSchema:
      type: object
      properties:
