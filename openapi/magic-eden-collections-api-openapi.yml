  /collections/{symbol}/stats:
    get:
      deprecated: false
      summary: Get stats of a collection
      security: []
      responses:
        '200':
          description: success response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CollectionStats'
              example:
                symbol: magicticket
                floorPrice: 2850000000
                listedCount: 877
                avgPrice24hr: 3009962636.8159204
                volumeAll: 76113329022113
        '400':
          description: Invalid symbol
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Collection not found
          content:
            application/json:
              schema:
                type: object
      parameters:
      - name: symbol
        in: path
        description: collection symbol
        required: true
        deprecated: false
        schema:
          type: string
      - name: timeWindow
        in: query
        description: Time window for stats, default all. '24h', '7d', '30d', 'all'
        required: false
        deprecated: false
        schema:
          type: string
      - name: listingAggMode
        in: query
        description: True to return aggregated marketplace listings, false to return just Magic Eden listings. Defaults to false.
        required: false
        deprecated: false
        schema:
          type: boolean
      tags:
      - Collections
    servers:
    - url: https://api-mainnet.magiceden.dev/v2
    - url: https://api-devnet.magiceden.dev/v2
